server {
    listen 80;
    server_name a1sc.cn www.a1sc.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name a1sc.cn www.a1sc.cn;

    ssl_certificate /www/server/panel/vhost/cert/a1sc.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/a1sc.cn/privkey.pem;

    root /www/wwwroot/a1sc.cn;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;

    # Webhook 自动部署
    location /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    # API 请求转发后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }

    # JS/CSS 静态资源长期缓存（Vite 构建带 hash，内容变了 hash 就变）
    location ~* /assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
